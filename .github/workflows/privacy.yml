name: Privacy scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generic leak patterns only (IPs, hostnames, emails, tokens, keys).
      # The private words list is deliberately NOT stored on GitHub; that check
      # runs locally in the git hooks before anything is pushed.
      - name: Scan all files for leak patterns
        run: node scripts/privacy-scan.mjs --all

      - name: Scan commit messages for leak patterns
        run: |
          git log --format=%B -n 50 > /tmp/messages.txt
          node scripts/privacy-scan.mjs --message /tmp/messages.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
